<!DOCTYPE html>
<html>

<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Options</title>
	<style>
		* {
			margin: 0;
			padding: 0;
		}

		body {
			background-color: black;
			color: white;
			padding: 2.5rem;
			overflow: hidden;
		}

		input {
			width: 100%;
			box-sizing: border-box;
			background-color: black;
			border: 1px solid white;
			border-radius: 4px;
			color: white;
			font-family: 'Courier New', Courier, monospace;
			padding: 0.7rem;
		}

		#settings-submit {
			display: none;
		}
	</style>
</head>

<body>

	<form id="settings-form">
		<input autofocus placeholder="Dilation factor (Number between 0.0 and 1000.0)" id="dil-input">
		<input placeholder="Target hostnames (Separate with comma)" id="hsts-input">
		<button type="submit" id="settings-submit"></button>
	</form>

	<script src="options.js"></script>
</body>

</html>
