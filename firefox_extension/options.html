<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Options</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <header>
    <h1>
      <span class="space-after maybe-hidden">Time Machine</span><span>Options</span>
    </h1>
  </header>
  <main>
    <form id="settings-form">
      <input autofocus placeholder="Dilation factor" id="dil-input">
      <input placeholder="Target hostnames" id="hsts-input">
      <button type="submit" class="settings-submit"></button>
      <div class="settings-hint">
        <span>Press Enter to save settings</span>
      </div>
      <div class="settings-hint">
        <span id="submit-status" style="opacity: 0.0;">Settings saved!</span>
      </div>
    </form>
  </main>
  <script src="options.js"></script>
</body>

</html>
